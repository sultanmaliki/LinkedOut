name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linkedout
          POSTGRES_PASSWORD: linkedout
          POSTGRES_DB: linkedout
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U linkedout -d linkedout"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://linkedout:linkedout@localhost:5432/linkedout
      # CI-only value. The app refuses to start without JWT_SECRET set;
      # never reuse this value outside of CI.
      JWT_SECRET: ci-test-secret-not-for-reuse
      # Required for tests asserting devVerificationToken/devResetToken in
      # auth responses -- see .env.example for why this isn't NODE_ENV-gated.
      # Safe here: CI's database is a fresh, disposable container.
      ALLOW_DEV_AUTH_TOKENS: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Push database schema
        # --force: drizzle-kit push wants an interactive confirmation for
        # this schema (see hiring-pipeline-v2's pipeline_stage enum), which
        # has no TTY in CI. Without --force, drizzle-kit prints "Interactive
        # prompts require a TTY" and silently no-ops -- it does not set a
        # nonzero exit code, so the step reports success while the database
        # stays completely empty, and every test touching a real DB
        # connection then fails with confusing 500s. --force is safe here
        # because CI's database is a fresh, disposable container recreated
        # every run; never use it against a real database.
        run: pnpm --filter @linkedout/database push --force

      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
