name: Database backup

on:
  schedule:
    # 03:00 UTC nightly. The free-tier Postgres host this project uses today
    # (Supabase, free plan) does not include automatic backups — see
    # docs/operational-runbook.md — so this workflow is the backup until/
    # unless that changes.
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: pg_dump and upload
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        run: |
          mkdir -p backup
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges \
            --file="backup/linkedout-$(date -u +%Y%m%dT%H%M%SZ).dump"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/*.dump
          # Free tier's usable window — raise this only alongside an actual
          # storage plan; artifacts count against the account's storage quota.
          retention-days: 30
