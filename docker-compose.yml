services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: linkedout
      POSTGRES_USER: linkedout
      POSTGRES_PASSWORD: linkedout
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linkedout -d linkedout']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://linkedout:linkedout@postgres:5432/linkedout
      JWT_SECRET: dev-secret
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/database/node_modules
      - /app/packages/types/node_modules
      - /app/packages/ui/node_modules

  valkey:
    image: valkey/valkey:7.2
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: linkedout
      MINIO_ROOT_PASSWORD: linkedout123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: linkedout-master-key
    ports:
      - '7700:7700'
    volumes:
      - meili-data:/meili_data

volumes:
  postgres-data:
  minio-data:
  meili-data:
