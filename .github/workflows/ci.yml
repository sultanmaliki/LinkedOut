name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linkedout
          POSTGRES_PASSWORD: linkedout
          POSTGRES_DB: linkedout
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U linkedout -d linkedout"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgres://linkedout:linkedout@localhost:5432/linkedout

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Push database schema
        run: pnpm --filter @linkedout/database push

      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
